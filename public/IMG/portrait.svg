<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140709" />
      <stop offset="50%" stop-color="#0d0507" />
      <stop offset="100%" stop-color="#070203" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E3F57" />
      <stop offset="100%" stop-color="#C77D8B" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a1824" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="600" height="750" fill="url(#bg)" />
  <rect width="600" height="750" fill="url(#grid)" />
  
  <!-- Stylized Geometric Cyber Silhouette -->
  <g transform="translate(150, 140)">
    <circle cx="150" cy="120" r="90" fill="#180a0e" stroke="#3a1824" stroke-width="2" />
    <path d="M 50 360 C 50 250, 250 250, 250 360 Z" fill="#180a0e" stroke="#3a1824" stroke-width="2" />
    <!-- Cyber overlay lines -->
    <circle cx="150" cy="120" r="70" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.7"/>
    <line x1="60" y1="120" x2="240" y2="120" stroke="#9E3F57" stroke-width="1" opacity="0.4" />
    <line x1="150" y1="30" x2="150" y2="210" stroke="#9E3F57" stroke-width="1" opacity="0.4" />
    <rect x="120" y="90" width="60" height="60" fill="none" stroke="#C77D8B" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Technical Telemetry UI elements -->
  <text x="40" y="50" fill="#9E3F57" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">SYS_ID // NODE.OPERATOR</text>
  <text x="40" y="70" fill="#8A5461" font-family="'JetBrains Mono', monospace" font-size="10">COORDINATES: 40.7128° N, 74.0060° W</text>
  <line x1="40" y1="85" x2="260" y2="85" stroke="#3a1824" stroke-width="1" />

  <text x="40" y="710" fill="#C9B0B4" font-family="'JetBrains Mono', monospace" font-size="11">BIOMETRIC IDENTIFIER // VALIDATED</text>
  <rect x="520" y="690" width="40" height="20" fill="none" stroke="#9E3F57" stroke-width="1" />
  <circle cx="540" cy="700" r="4" fill="#C77D8B" />
</svg>
